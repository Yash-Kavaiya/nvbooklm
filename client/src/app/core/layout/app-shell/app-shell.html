<mat-toolbar class="app-toolbar">
    <button mat-icon-button (click)="snav.toggle()">
        <mat-icon>menu</mat-icon>
    </button>
    <span class="app-title" routerLink="/">nvbooklm</span>
    <span class="spacer"></span>

    @if (authService.user(); as user) {
    <button mat-icon-button [matMenuTriggerFor]="userMenu">
        @if (user.photoURL) {
        <img [src]="user.photoURL" alt="Profile" class="user-avatar">
        } @else {
        <mat-icon>account_circle</mat-icon>
        }
    </button>
    <mat-menu #userMenu="matMenu">
        <div class="user-info">
            <strong>{{ user.displayName || 'User' }}</strong>
            <small>{{ user.email }}</small>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="signOut()">
            <mat-icon>logout</mat-icon>
            <span>Sign out</span>
        </button>
    </mat-menu>
    }
</mat-toolbar>

<mat-sidenav-container class="app-container">
    <mat-sidenav #snav mode="side" opened="true" class="app-sidenav" [fixedInViewport]="true" [fixedTopGap]="64">
        <mat-nav-list>
            <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                <mat-icon matListItemIcon>dashboard</mat-icon>
                <span matListItemTitle>Notebooks</span>
            </a>
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="app-content">
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
